name: Validate

on:
  push:
    branches:
      - main
      - feat/live-tail-progress-engine
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }}${{ matrix.shardName }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shardName: ""
          - os: windows-latest
            shardName: ""
          # Keep files serial inside each Intel runner without exhausting one job's 30-minute budget.
          - os: macos-26-intel
            shard: 0
            shardName: ", shard 1/2"
          - os: macos-26-intel
            shard: 1
            shardName: ", shard 2/2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build distributive
        run: npm run build
      - name: Run typecheck
        run: npm run typecheck
      - name: Run Windows bus lifecycle probes
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --import ./tests/fixtures/canonical-tmpdir.ts
          --test --test-concurrency=1 --test-reporter=spec
          --test-name-pattern="active profile endpoint|replacement endpoint generation|Leader assembly serializes follower provisioning"
          tests/bus.test.ts tests/bus-leader.test.ts
      - name: Run Windows outbound voice executable probe
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          --test-name-pattern="Windows cmd|multipart voice calls|scoped follower API calls"
          tests/command-templates.test.ts tests/outbound-voice.test.ts
          tests/bus-follower.test.ts tests/bus-leader.test.ts
      - name: Run tests
        if: matrix.os != 'macos-26-intel'
        run: npm test
      # Real-process tests run alone, exactly once; the runner also keeps the local Pi CLI on PATH.
      - name: Run real-process tests alone
        if: matrix.os == 'macos-26-intel' && matrix.shard == 0
        run: node scripts/run-macos-tests.mjs 0 process
      - name: Run remaining shard tests one file at a time
        if: matrix.os == 'macos-26-intel'
        run: node scripts/run-macos-tests.mjs ${{ matrix.shard }} remaining
      - name: Check package contents
        run: npm run pack:check
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit
